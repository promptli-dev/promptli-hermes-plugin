name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q

  hermes:
    # The real Hermes Agent: the adapter inside its gateway pipeline, then the catalog gate
    # (`hermes plugins validate --install-deps`, what the plugin catalog's CI runs).
    runs-on: ubuntu-latest
    env:
      HERMES_REF: v2026.9.24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: plugin
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install Hermes from its lockfile
        working-directory: hermes-agent
        run: uv sync --frozen --python 3.14
      - name: Integration tests
        run: |
          uv pip install --python hermes-agent/.venv/bin/python "promptli>=0.2.2,<0.3" "promptli-gateway>=0.2.2,<0.3" \
            "pytest>=8.3,<10" "pytest-asyncio>=0.25,<2"
          cd plugin
          HERMES_AGENT_SRC="$GITHUB_WORKSPACE/hermes-agent" ../hermes-agent/.venv/bin/python -m pytest -q -m hermes \
            -p no:cacheprovider
      - name: hermes plugins validate / doctor
        run: |
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          mkdir -p "$RUNNER_TEMP/check" && cp -r plugin "$RUNNER_TEMP/check/promptli-comms"
          hermes-agent/.venv/bin/hermes plugins validate "$RUNNER_TEMP/check/promptli-comms" --install-deps
          hermes-agent/.venv/bin/hermes plugins doctor "$RUNNER_TEMP/check/promptli-comms" --ci

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: shellcheck install.sh && sh -n install.sh
